name: FNF Mod Build

on:
  workflow_dispatch:
    inputs:
      mod_id:
        description: 'Mod UUID'
        required: true
      zip_url:
        description: 'Source ZIP Download URL (GitHub Release)'
        required: true
      callback_url:
        description: 'Callback URL (unused, kept for compat)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup Haxe 4.3.6
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.6'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y neko rsync unzip

      - name: Download source ZIP from GitHub Release
        run: |
          mkdir -p $GITHUB_WORKSPACE/mod_src
          echo "다운로드 URL: ${{ github.event.inputs.zip_url }}"
          curl -L --retry 3 --retry-delay 2 --max-time 120 \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.event.inputs.zip_url }}" \
            -o /tmp/source.zip
          ls -lh /tmp/source.zip
          unzip -o /tmp/source.zip -d $GITHUB_WORKSPACE/mod_src
          # 최상위 폴더 1개면 그 안으로 이동
          ITEMS=$(ls $GITHUB_WORKSPACE/mod_src | wc -l)
          FIRST=$(ls $GITHUB_WORKSPACE/mod_src | head -1)
          if [ "$ITEMS" = "1" ] && [ -d "$GITHUB_WORKSPACE/mod_src/$FIRST" ]; then
            mv "$GITHUB_WORKSPACE/mod_src/$FIRST/"* "$GITHUB_WORKSPACE/mod_src/" 2>/dev/null || true
            rmdir "$GITHUB_WORKSPACE/mod_src/$FIRST" 2>/dev/null || true
          fi
          echo "=== 소스 파일 목록 ==="
          ls $GITHUB_WORKSPACE/mod_src | head -20

      - name: Parse Project.xml versions
        id: versions
        run: |
          PROJECT=$(find $GITHUB_WORKSPACE/mod_src -name "Project.xml" | head -1 || true)
          if [ -n "$PROJECT" ]; then
            echo "=== Project.xml haxelib entries ==="
            grep -i "haxelib" "$PROJECT" || true
            get_ver() { grep -oP "(?<=name=\"$1\" version=\")[^\"]+" "$PROJECT" 2>/dev/null || echo ""; }
            echo "flixel=$(get_ver flixel)"           >> $GITHUB_OUTPUT
            echo "flixel_addons=$(get_ver flixel-addons)" >> $GITHUB_OUTPUT
            echo "lime=$(get_ver lime)"               >> $GITHUB_OUTPUT
            echo "openfl=$(get_ver openfl)"           >> $GITHUB_OUTPUT
            echo "hxcpp=$(get_ver hxcpp)"             >> $GITHUB_OUTPUT
            echo "tjson=$(get_ver tjson)"             >> $GITHUB_OUTPUT
            echo "hscript=$(get_ver hscript)"         >> $GITHUB_OUTPUT
            echo "hxcodec=$(get_ver hxCodec)"         >> $GITHUB_OUTPUT
            echo "polymod=$(get_ver polymod)"         >> $GITHUB_OUTPUT
          fi

      - name: Install ALL haxelibs
        run: |
          haxelib setup ~/haxelib

          install_lib() {
            local LIB=$1 VER=$2
            if [ -n "$VER" ]; then
              echo "==> $LIB@$VER"
              haxelib install "$LIB" "$VER" --quiet 2>&1 | tail -3 || true
              haxelib set "$LIB" "$VER" 2>/dev/null || true
            else
              echo "==> $LIB (latest)"
              haxelib install "$LIB" --quiet 2>&1 | tail -3 || true
            fi
          }

          # 핵심 라이브러리 (Project.xml 버전 우선, 없으면 latest)
          install_lib lime            "${{ steps.versions.outputs.lime }}"
          install_lib openfl          "${{ steps.versions.outputs.openfl }}"
          install_lib flixel          "${{ steps.versions.outputs.flixel }}"
          install_lib flixel-addons   "${{ steps.versions.outputs.flixel_addons }}"
          install_lib hxcpp           "${{ steps.versions.outputs.hxcpp }}"

          # Psych Engine 필수 라이브러리 (버전 지정 없으면 latest)
          install_lib tjson           "${{ steps.versions.outputs.tjson }}"
          install_lib hscript         "${{ steps.versions.outputs.hscript }}"
          install_lib hxCodec         "${{ steps.versions.outputs.hxcodec }}"
          install_lib polymod         "${{ steps.versions.outputs.polymod }}"
          install_lib flixel-tools    ""
          install_lib actuate         ""
          install_lib hxp             ""

          # Project.xml 전체 파싱 → 나머지 haxelib 자동 설치
          PROJECT=$(find $GITHUB_WORKSPACE/mod_src -name "Project.xml" | head -1 || true)
          if [ -n "$PROJECT" ]; then
            python3 << 'PY'
          import xml.etree.ElementTree as ET, subprocess, os
          already = {"lime","openfl","flixel","flixel-addons","hxcpp",
                     "tjson","hscript","hxCodec","polymod","flixel-tools","actuate","hxp"}
          try:
              tree = ET.parse(os.environ.get("PROJECT",""))
              for el in tree.iter():
                  if el.tag == "haxelib":
                      name = el.get("name","").strip()
                      ver  = el.get("version","").strip()
                      if name and name not in already:
                          already.add(name)
                          cmd = ["haxelib","install",name,"--quiet"]
                          if ver: cmd.insert(2, ver)
                          print(f"==> 추가: {name} {ver or '(latest)'}")
                          subprocess.run(cmd, check=False)
                          if ver: subprocess.run(["haxelib","set",name,ver], check=False)
          except Exception as e:
              print(f"[WARN] {e}")
          PY
          fi

          haxelib run lime setup 2>/dev/null || true
          echo "=== 설치된 haxelibs ==="
          haxelib list

      - name: Find Project.xml or .hxml
        id: find_project
        run: |
          PROJECT=$(find $GITHUB_WORKSPACE/mod_src -name "Project.xml" | head -1 || true)
          HXML=$(find $GITHUB_WORKSPACE/mod_src -name "*.hxml" | head -1 || true)
          if [ -n "$PROJECT" ]; then
            echo "type=lime"                    >> $GITHUB_OUTPUT
            echo "file=$PROJECT"               >> $GITHUB_OUTPUT
            echo "cwd=$(dirname $PROJECT)"     >> $GITHUB_OUTPUT
            echo "Found Project.xml: $PROJECT"
          elif [ -n "$HXML" ]; then
            echo "type=hxml"                   >> $GITHUB_OUTPUT
            echo "file=$HXML"                  >> $GITHUB_OUTPUT
            echo "cwd=$(dirname $HXML)"        >> $GITHUB_OUTPUT
            echo "Found .hxml: $HXML"
          else
            echo "type=none" >> $GITHUB_OUTPUT
            echo "ERROR: Project.xml / .hxml 없음"
            find $GITHUB_WORKSPACE/mod_src -type f | head -20
            exit 1
          fi

      - name: Build
        working-directory: ${{ steps.find_project.outputs.cwd }}
        run: |
          # 빌드 출력 디렉토리 사전 생성 (권한 오류 방지)
          mkdir -p export/html5/bin export/release/html5/bin export/final/html5/bin

          TYPE="${{ steps.find_project.outputs.type }}"
          if [ "$TYPE" = "lime" ]; then
            haxelib run lime build html5 -final 2>&1
          else
            haxe "$(basename '${{ steps.find_project.outputs.file }}')" 2>&1
          fi
          echo "Build exit: $?"

      - name: Collect output
        run: |
          mkdir -p /tmp/build_output
          CWD="${{ steps.find_project.outputs.cwd }}"

          BUILD_SRC=""
          for CANDIDATE in \
            "$CWD/export/release/html5/bin" \
            "$CWD/export/html5/bin" \
            "$CWD/export/final/html5/bin" \
            "$CWD/export"; do
            if [ -f "$CANDIDATE/index.html" ]; then
              BUILD_SRC="$CANDIDATE"
              break
            fi
          done

          # 못 찾으면 전체 탐색
          if [ -z "$BUILD_SRC" ]; then
            BUILD_SRC=$(find "$GITHUB_WORKSPACE/mod_src" -mindepth 2 -name "index.html" \
              | head -1 | xargs -I{} dirname {} 2>/dev/null || true)
          fi

          if [ -n "$BUILD_SRC" ] && [ -f "$BUILD_SRC/index.html" ]; then
            rsync -a --no-perms "$BUILD_SRC/" /tmp/build_output/
            echo "수집 완료: $BUILD_SRC"
            ls /tmp/build_output/ | head -10
          else
            echo "index.html 없음 — 빌드 실패"
            find "$GITHUB_WORKSPACE/mod_src" -type f \( -name "*.js" -o -name "*.html" \) | head -10
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnf-build-${{ github.event.inputs.mod_id }}
          path: /tmp/build_output/
          retention-days: 1

      - name: Cleanup GitHub Release
        if: always()
        run: |
          TAG="fnf-mod-${{ github.event.inputs.mod_id }}"
          REPO="${{ github.repository }}"
          REL_ID=$(curl -sf \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -n "$REL_ID" ]; then
            curl -sf -X DELETE \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/releases/$REL_ID" || true
          fi
          curl -sf -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/git/refs/tags/$TAG" || true
          echo "Release/Tag 정리 완료: $TAG"
