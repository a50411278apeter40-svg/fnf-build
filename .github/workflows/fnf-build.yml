name: FNF Mod Build

on:
  workflow_dispatch:
    inputs:
      mod_id:
        description: 'Mod UUID'
        required: true
      zip_url:
        description: 'Source ZIP 조각(part_0000.bin ...)들이 있는 base URL (끝에 / 포함, raw.githubusercontent.com)'
        required: true
      part_count:
        description: '조각 개수 (20MB 단위로 분할 업로드됨, 기본 1)'
        required: false
        default: '1'
      callback_url:
        description: 'Callback URL (unused, kept for compat)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.6'

      - name: Install Neko
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y neko

      - name: Download source ZIP (조각 재조립)
        # [구조 변경] 브라우저가 20MB 단위로 조각내어 mods/{mod_id}/part_0000.bin ...
        # 형태로 직접 커밋한다(GitHub API 요청당 실측 한도 30~40MB 회피, 문서상
        # 100MB지만 실제로는 40MB부터 "too large to process"로 실패함을 확인).
        # 여기서 조각을 전부 내려받아 순서대로 이어붙인 뒤 압축을 푼다.
        run: |
          mkdir -p $GITHUB_WORKSPACE/mod_src /tmp/parts
          BASE_URL="${{ github.event.inputs.zip_url }}"
          PART_COUNT="${{ github.event.inputs.part_count }}"
          if [ -z "$PART_COUNT" ]; then PART_COUNT=1; fi
          echo "베이스 URL: $BASE_URL / 조각 개수: $PART_COUNT"
          for i in $(seq 0 $((PART_COUNT-1))); do
            IDX=$(printf "%04d" "$i")
            echo "다운로드: part_${IDX}.bin"
            curl -L --retry 3 --retry-delay 2 --max-time 60 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "${BASE_URL}part_${IDX}.bin" \
              -o "/tmp/parts/part_${IDX}.bin"
          done
          cat /tmp/parts/part_*.bin > /tmp/source.zip
          rm -f /tmp/parts/*.bin
          ls -lh /tmp/source.zip
          unzip -o /tmp/source.zip -d $GITHUB_WORKSPACE/mod_src
          ITEMS=$(ls $GITHUB_WORKSPACE/mod_src | wc -l)
          FIRST=$(ls $GITHUB_WORKSPACE/mod_src | head -1)
          if [ "$ITEMS" = "1" ] && [ -d "$GITHUB_WORKSPACE/mod_src/$FIRST" ]; then
            mv "$GITHUB_WORKSPACE/mod_src/$FIRST/"* "$GITHUB_WORKSPACE/mod_src/" 2>/dev/null || true
            rmdir "$GITHUB_WORKSPACE/mod_src/$FIRST" 2>/dev/null || true
          fi
          echo "소스 파일 목록:"
          ls $GITHUB_WORKSPACE/mod_src | head -15

      - name: Detect required haxelib versions from Project.xml
        id: detect_versions
        run: |
          PROJECT=$(find $GITHUB_WORKSPACE/mod_src -name "Project.xml" | head -1 || true)
          if [ -n "$PROJECT" ]; then
            echo "=== Project.xml haxelib entries ==="
            grep -i "haxelib" "$PROJECT" || true
            FLIXEL_VER=$(grep -oP '(?<=name="flixel" version=")[^"]+' "$PROJECT" || true)
            FLIXEL_ADDONS_VER=$(grep -oP '(?<=name="flixel-addons" version=")[^"]+' "$PROJECT" || true)
            LIME_VER=$(grep -oP '(?<=name="lime" version=")[^"]+' "$PROJECT" || true)
            OPENFL_VER=$(grep -oP '(?<=name="openfl" version=")[^"]+' "$PROJECT" || true)
            HXCPP_VER=$(grep -oP '(?<=name="hxcpp" version=")[^"]+' "$PROJECT" || true)
            echo "flixel_ver=${FLIXEL_VER}" >> $GITHUB_OUTPUT
            echo "flixel_addons_ver=${FLIXEL_ADDONS_VER}" >> $GITHUB_OUTPUT
            echo "lime_ver=${LIME_VER}" >> $GITHUB_OUTPUT
            echo "openfl_ver=${OPENFL_VER}" >> $GITHUB_OUTPUT
            echo "hxcpp_ver=${HXCPP_VER}" >> $GITHUB_OUTPUT
            echo "Detected: flixel=$FLIXEL_VER openfl=$OPENFL_VER lime=$LIME_VER hxcpp=$HXCPP_VER"
          fi

      - name: Install haxelibs
        run: |
          haxelib setup ~/haxelib

          # [버그 수정] 이전엔 hxdiscord_rpc 등 핵심 라이브러리를 버전 지정 없이
          # "latest"로 먼저 깔아버린 뒤, Project.xml 전체 파싱 단계에서는 이미
          # "설치된 이름"으로 취급해 건너뛰었다. 그 결과 모드가 Project.xml에
          # 예: <haxelib name="hxdiscord_rpc" version="1.2.4" /> 로 특정 버전을
          # 요구해도 실제로는 latest(1.3.0)만 설치되어 컴파일러가
          # "Could not find haxelib hxdiscord_rpc version 1.2.4" 오류를 냈다.
          # 수정: Project.xml에 명시된 haxelib(이름+버전)을 최우선으로 정확히
          # 설치하고, 그 이후 핵심 라이브러리 기본값은 "아직 설치 안 된 것만" 채운다.
          PROJECT_PATH=$(find $GITHUB_WORKSPACE/mod_src -name "Project.xml" | head -1 || true)
          INSTALLED_FROM_PROJECT=""
          if [ -n "$PROJECT_PATH" ]; then
            echo "Project.xml 파싱 중(명시된 haxelib 우선 설치): $PROJECT_PATH"
            python3 - "$PROJECT_PATH" << 'PY'
          import xml.etree.ElementTree as ET, subprocess, sys
          proj = sys.argv[1]
          installed = []
          try:
              tree = ET.parse(proj)
              for el in tree.iter():
                  if el.tag == "haxelib":
                      name = el.get("name", "").strip()
                      ver = el.get("version", "").strip()
                      if not name:
                          continue
                      installed.append(name.lower())
                      cmd = ["haxelib", "install", name]
                      if ver:
                          cmd.append(ver)
                      cmd.append("--quiet")
                      print(f"==> Project.xml 명시 설치: {name} {ver or '(latest)'}")
                      subprocess.run(cmd, check=False)
                      if ver:
                          subprocess.run(["haxelib", "set", name, ver], check=False)
              with open("/tmp/installed_from_project.txt", "w") as f:
                  f.write(" ".join(installed))
          except Exception as e:
              print(f"[WARN] Project.xml 파싱 오류: {e}", file=sys.stderr)
          PY
            INSTALLED_FROM_PROJECT=$(cat /tmp/installed_from_project.txt 2>/dev/null || true)
          fi
          echo "Project.xml에서 이미 설치된 라이브러리: $INSTALLED_FROM_PROJECT"

          is_installed() {
            case " $INSTALLED_FROM_PROJECT " in
              *" $1 "*) return 0 ;;
              *) return 1 ;;
            esac
          }

          install_lib() {
            LIB=$1; VER=$2
            LOWER=$(echo "$LIB" | tr '[:upper:]' '[:lower:]')
            if is_installed "$LOWER"; then
              echo "==> $LIB 은 Project.xml에서 이미 설치됨 (건너뜀)"
              return
            fi
            if [ -n "$VER" ]; then
              echo "==> $LIB $VER 설치"
              haxelib install "$LIB" "$VER" --quiet 2>&1 | grep -v "^[0-9]" || true
              haxelib set "$LIB" "$VER" 2>/dev/null || true
            else
              echo "==> $LIB (latest) 설치"
              haxelib install "$LIB" --quiet 2>&1 | grep -v "^[0-9]" || true
            fi
          }

          install_lib lime      "${{ steps.detect_versions.outputs.lime_ver }}"
          install_lib openfl    "${{ steps.detect_versions.outputs.openfl_ver }}"
          install_lib flixel    "${{ steps.detect_versions.outputs.flixel_ver }}"
          install_lib flixel-addons "${{ steps.detect_versions.outputs.flixel_addons_ver }}"
          if [ -n "${{ steps.detect_versions.outputs.hxcpp_ver }}" ]; then
            install_lib hxcpp "${{ steps.detect_versions.outputs.hxcpp_ver }}"
          else
            install_lib hxcpp ""
          fi

          # 핵심 라이브러리 기본값 — Project.xml에 명시가 없을 때만 채워넣는다
          CORE_LIBS="tjson:1.4.0 hscript: hxCodec: polymod: actuate: hxp: hxdiscord_rpc:"
          for ENTRY in $CORE_LIBS; do
            LIB="${ENTRY%%:*}"
            VER="${ENTRY##*:}"
            install_lib "$LIB" "$VER"
          done

          haxelib run lime setup 2>/dev/null || true
          echo "=== 설치된 haxelibs ==="
          haxelib list

      - name: Find Project.xml or .hxml
        id: find_project
        run: |
          PROJECT=$(find $GITHUB_WORKSPACE/mod_src -name "Project.xml" | head -1 || true)
          HXML=$(find $GITHUB_WORKSPACE/mod_src -name "*.hxml" | head -1 || true)
          if [ -n "$PROJECT" ]; then
            echo "type=lime" >> $GITHUB_OUTPUT
            echo "file=$PROJECT" >> $GITHUB_OUTPUT
            echo "cwd=$(dirname $PROJECT)" >> $GITHUB_OUTPUT
            echo "Found Project.xml: $PROJECT"
          elif [ -n "$HXML" ]; then
            echo "type=hxml" >> $GITHUB_OUTPUT
            echo "file=$HXML" >> $GITHUB_OUTPUT
            echo "cwd=$(dirname $HXML)" >> $GITHUB_OUTPUT
            echo "Found .hxml: $HXML"
          else
            echo "type=none" >> $GITHUB_OUTPUT
            echo "ERROR: No Project.xml or .hxml found!"
            find $GITHUB_WORKSPACE/mod_src -type f | head -20
            exit 1
          fi

      - name: Build HTML5 (lime)
        if: steps.find_project.outputs.type == 'lime'
        working-directory: ${{ steps.find_project.outputs.cwd }}
        run: |
          mkdir -p export/html5/bin export/release/html5/bin export/final/html5/bin
          # [버그 수정] Psych Engine류 모드의 Project.xml이 데스크톱 전용
          # MULTITHREADED_LOADING(sys.thread.FixedThreadPool 사용) define을
          # html5에서 제대로 배제하지 못하면 컴파일러가
          # "sys/thread/FixedThreadPool.hx: This class is not available on
          # this target" 오류로 실패한다(HTML5는 스레드 자체를 지원하지 않음).
          # 업로드되는 모드마다 Project.xml 내용을 신뢰할 수 없으므로,
          # 서버(CI) 단에서 항상 -D HXCPP_NO_THREADS를 강제로 넘겨
          # 스레드풀 경로를 원천적으로 비활성화한다.
          haxelib run lime build html5 -final -D HXCPP_NO_THREADS 2>&1
          echo "Build exit: $?"

      - name: Build HTML5 (hxml)
        if: steps.find_project.outputs.type == 'hxml'
        working-directory: ${{ steps.find_project.outputs.cwd }}
        run: |
          haxe "$(basename '${{ steps.find_project.outputs.file }}')" -D HXCPP_NO_THREADS

      - name: Collect build output
        run: |
          mkdir -p /tmp/build_output

          # lime html5 빌드 결과물 경로 우선순위대로 탐색
          BUILD_SRC=""
          for CANDIDATE in \
            "$GITHUB_WORKSPACE/mod_src/export/release/html5/bin" \
            "$GITHUB_WORKSPACE/mod_src/export/html5/bin" \
            "$GITHUB_WORKSPACE/mod_src/export/final/html5/bin" \
            "$GITHUB_WORKSPACE/mod_src/export"; do
            if [ -f "$CANDIDATE/index.html" ]; then
              BUILD_SRC="$CANDIDATE"
              break
            fi
          done

          # 못 찾으면 전체에서 index.html 탐색 (단, mod_src 루트 제외)
          if [ -z "$BUILD_SRC" ]; then
            BUILD_SRC=$(find "$GITHUB_WORKSPACE/mod_src" -mindepth 2 -name "index.html" | head -1 | xargs -I{} dirname {} 2>/dev/null || true)
          fi

          if [ -n "$BUILD_SRC" ] && [ "$BUILD_SRC" != "$GITHUB_WORKSPACE/mod_src" ]; then
            rsync -a --no-perms "$BUILD_SRC/" /tmp/build_output/
            echo "수집 완료: $BUILD_SRC"
            ls /tmp/build_output/ | head -10
          else
            echo "index.html 없음 또는 유효 경로 아님 — 빌드 실패"
            find "$GITHUB_WORKSPACE/mod_src" -type f \( -name "*.js" -o -name "*.html" \) | head -10
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnf-build-${{ github.event.inputs.mod_id }}
          path: /tmp/build_output/
          retention-days: 1

      - name: Cleanup 커밋된 mod 조각들 (빌드 후 소스 삭제)
        # [구조 변경] 브라우저가 mods/{mod_id}/part_0000.bin ... 형태로 여러
        # 조각을 직접 커밋하므로, 정리 로직도 조각 개수만큼 반복해서 지운다.
        if: always()
        run: |
          REPO="${{ github.repository }}"
          MOD_ID="${{ github.event.inputs.mod_id }}"
          PART_COUNT="${{ github.event.inputs.part_count }}"
          if [ -z "$PART_COUNT" ]; then PART_COUNT=1; fi
          for i in $(seq 0 $((PART_COUNT-1))); do
            IDX=$(printf "%04d" "$i")
            PATH_IN_REPO="mods/${MOD_ID}/part_${IDX}.bin"
            SHA=$(curl -sf \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/contents/$PATH_IN_REPO?ref=main" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              curl -sf -X DELETE \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d "{\"message\":\"cleanup mod ${MOD_ID} part ${IDX}\",\"sha\":\"${SHA}\",\"branch\":\"main\"}" \
                "https://api.github.com/repos/$REPO/contents/$PATH_IN_REPO" || true
              echo "삭제: $PATH_IN_REPO"
            else
              echo "삭제할 조각을 찾지 못함 (이미 삭제됐거나 sha 조회 실패): $PATH_IN_REPO"
            fi
          done
